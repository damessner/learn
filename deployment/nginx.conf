server {
    listen 80;
    server_name _;

    # Maximum file upload size (for audio and image attachments)
    client_max_body_size 50M;

    # Frontend Static Assets
    root /var/www/learnflow/frontend/dist;
    index index.html;

    # Handle SPA routing (redirect all non-file requests to index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy API requests to Express backend
    location /api {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve uploaded media files directly from backend uploads folder
    location /uploads {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Custom error page configurations
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
